<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Draft</title>

    <!-- Barlow Condensed (Lucy tin brand) + DM Sans (body) are SELF-HOSTED — imported in main.jsx,
         served from our own origin. The <link> and two preconnects to fonts.googleapis.com /
         fonts.gstatic.com that used to sit here handed Google every visitor's IP and user-agent on
         every page load, undisclosed. Do not re-add them; test/selfHostedFonts.test.js fails. -->

    <!-- Apply saved bg-mode + dark class before React renders to avoid FOUC -->
    <script>
    (function(){
      var bg = localStorage.getItem('rm-bg-mode') || 'glass-light';
      document.documentElement.setAttribute('data-bg', bg);
    })();
    </script>

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { background: transparent; }
      @keyframes spin        { to { transform: rotate(360deg); } }
      @keyframes shimmer     { 0%{background-position:-200% 0} 100%{background-position:200% 0} }
      @keyframes fadeSlideUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
      @keyframes scrollUp    { 0%{transform:translateY(0)} 100%{transform:translateY(-50%)} }
      @keyframes pulseGlow   { 0%,100%{opacity:1} 50%{opacity:0.6} }
      @keyframes zoomIn      { from{opacity:0;transform:scale(0.97)} to{opacity:1;transform:scale(1)} }

      /* Lucy brand: Barlow Condensed ExtraBold site title */
      .site-title {
        font-family: 'Barlow Condensed', 'DM Sans', system-ui, sans-serif;
        font-weight: 800;
        font-size: 28px;
        color: #0f0f0f;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
