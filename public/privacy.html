<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Resume Master — privacy</title>
  <link rel="stylesheet" href="/site.css">
</head>
<body>
  <div class="wrap">
    <header class="top"><a class="wordmark" href="/">Resume <em>Master</em></a></header>
    <article class="panel glass" id="doc"><p class="note">Loading…</p></article>
  </div>
  <script>
    // docs/PRIVACY.md, served by the service itself — the page cannot say something the document does not.
    "use strict";
    const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    const inline = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
      .replace(/\*([^*]+)\*/g, "<em>$1</em>").replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (m, t, u) => /^(https?:|mailto:|\/)/.test(u) ? `<a href="${u}">${t}</a>` : t);
    function render(md) {
      const out = []; let table = null, list = null;
      const flush = () => { if (table) { out.push(`<table class="ledger">${table.join("")}</table>`); table = null; } if (list) { out.push(`<ul>${list.join("")}</ul>`); list = null; } };
      for (const line of md.split(/\r?\n/)) {
        if (/^\|/.test(line)) { if (/^\|[\s|:-]+\|$/.test(line)) continue; table = table || []; const cells = line.slice(1, -1).split("|").map(c => inline(c.trim()));
          table.push(`<tr>${cells.map(c => table.length === 0 ? `<th>${c}</th>` : `<td>${c}</td>`).join("")}</tr>`); continue; }
        if (/^- /.test(line)) { list = list || []; list.push(`<li>${inline(line.slice(2))}</li>`); continue; }
        flush();
        const h = line.match(/^(#{1,3}) (.*)$/);
        if (h) out.push(`<h${h[1].length + 1}>${inline(h[2])}</h${h[1].length + 1}>`);
        else if (line.trim()) out.push(`<p>${inline(line)}</p>`);
      }
      flush();
      return out.join("\n");
    }
    fetch("/v1/site/privacy").then(r => r.json()).then(j => { document.getElementById("doc").innerHTML = render(j.markdown); })
      .catch(() => { document.getElementById("doc").innerHTML = "<p class=\"msg bad\">Could not load the privacy statement.</p>"; });
  </script>
</body>
</html>
